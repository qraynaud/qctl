{% if has_guest_credentials %}
[Service]
# Relative names → /etc/credstore.encrypted/<name> (sealed by rocky-tier0-seal).
# Filenames match `# @tag(guest)` keys from provision/.env.*; qctl hydrates $CREDENTIALS_DIRECTORY.
{% for key in guest_credential_keys %}
LoadCredentialEncrypted={{ key }}
{% endfor %}
{% endif %}
