name: release

# Manual publish of GitHub release (linux-x64 binaries + checksums).
# Requires both confirmation checkboxes. Refuses if tag v$version already exists
# (CI on main only proposes a release when the version is still free).
# Runs the full CI suite on this commit before packaging.
# Plugin npm stage publish is separate: release-plugin.yml
# `varlock-local-encrypt` is embedded in qctl-host/qctl-guest (not a separate asset).
on:
  workflow_dispatch:
    inputs:
      confirm_new_version:
        description: 'Confirm package.json / QCTL_VERSION is the version I want to publish'
        type: boolean
        required: true
        default: false
      confirm_publish:
        description: 'Confirm create GitHub release + upload linux-x64 assets for that version'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Require confirmation checkboxes
        if: ${{ !(inputs.confirm_new_version && inputs.confirm_publish) }}
        run: |
          echo "::error::Check both confirmation boxes to publish a release."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Resolve version (refuse if already released)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(bun ci/check-version.js)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists — nothing to release. Bump package.json / QCTL_VERSION first."
            exit 1
          fi
          echo "Will publish ${TAG}"
          {
            echo "### Planned release \`${TAG}\`"
            echo ""
            echo "Changelog (commit subjects):"
            echo ""
            bun ci/release-changelog.js
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: gate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [gate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compile linux-x64 binaries
        run: bun run compile

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/qctl-host dist/qctl-guest dist/qctl-platform-rocky.mjs release/
          chmod +x release/qctl-host release/qctl-guest
          (
            cd release
            sha256sum qctl-host qctl-guest qctl-platform-rocky.mjs | tee SHA256SUMS
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          bun ci/release-notes.js > "$NOTES_FILE"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            release/qctl-host \
            release/qctl-guest \
            release/qctl-platform-rocky.mjs \
            release/SHA256SUMS
