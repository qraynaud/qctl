name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  # Keep workflow_call (from release) out of the branch cancel group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_call' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Versions aligned
        run: bun ci/check-version.js

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run test:lint

      - name: Knip
        run: bun run test:knip

      - name: Test
        run: bun test

      - name: Build vaultwarden plugin
        run: bun run --filter @qctl/vaultwarden-plugin build

      - name: Compile linux-x64 binaries
        run: bun run compile

      - name: Smoke --help
        run: |
          ./dist/qctl-host --help
          ./dist/qctl-guest --help
          ./dist/qctl-guest list
          # Seed kit is embedded in qctl-host — path/export must work without dist/rocky-seed/
          test ! -d ./dist/rocky-seed
          test -f ./dist/qctl-platform-rocky.mjs
          kit=$(./dist/qctl-host seed-kit path)
          test -f "$kit/cloud-init/user-data.yaml"
          rm -rf /tmp/qctl-seed-export-smoke
          ./dist/qctl-host seed-kit export /tmp/qctl-seed-export-smoke
          test -f /tmp/qctl-seed-export-smoke/cloud-init/user-data.yaml
          # Helper is embedded in host/guest; compile also stages dist/ for checkout runs.
          test -x ./dist/varlock-local-encrypt
          test -x ./packages/host/varlock-local-encrypt
          test -x ./packages/guest/varlock-local-encrypt
          test -f ./packages/vaultwarden-plugin/dist/vaultwarden.cjs

  # Propose a release only when package.json version is not yet a GitHub release.
  release-status:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Release readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(bun ci/check-version.js)"
          TAG="v${VERSION}"
          {
            echo "### Release status"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            {
              echo "\`${TAG}\` is **already published** — do not run the release workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "already published: ${TAG}"
          else
            {
              echo "\`${TAG}\` is **not published** yet."
              echo ""
              echo "Changelog preview (commit subjects since previous \`v*\` tag):"
              echo ""
              bun ci/release-changelog.js
              echo ""
              echo "To publish: **Actions → release** → check both confirmation boxes → Run workflow on \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready to release: ${TAG}"
          fi
