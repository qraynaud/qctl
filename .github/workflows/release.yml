name: release

# After merge to main: run pr-check once, then environment-gated publishes.
# Approvals appear only when that version is unpublished (`release-qctl` /
# `release-plugin`). npm OIDC trusted publisher = this workflow (`release.yml`).
# `varlock-local-encrypt` is embedded in qctl-host/qctl-guest (not a separate asset).
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN

jobs:
  check:
    uses: ./.github/workflows/pr-check.yml

  plan:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      qctl_needed: ${{ steps.plan.outputs.qctl_needed }}
      qctl_version: ${{ steps.plan.outputs.qctl_version }}
      qctl_tag: ${{ steps.plan.outputs.qctl_tag }}
      plugin_needed: ${{ steps.plan.outputs.plugin_needed }}
      plugin_version: ${{ steps.plan.outputs.plugin_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Plan releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QCTL_VERSION="$(bun ci/check-version.js)"
          QCTL_TAG="v${QCTL_VERSION}"
          echo "qctl_version=${QCTL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "qctl_tag=${QCTL_TAG}" >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if gh release view "$QCTL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "qctl_needed=false" >> "$GITHUB_OUTPUT"
            echo "- **qctl** \`${QCTL_TAG}\`: already published (no approval)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "qctl_needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "- **qctl** \`${QCTL_TAG}\`: waiting for **release-qctl** approval"
              echo ""
              echo "<details><summary>Changelog preview</summary>"
              echo ""
              bun ci/release-changelog.js
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          PLUGIN_VERSION="$(bun -e 'console.log(require("./packages/vaultwarden-plugin/package.json").version)')"
          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          PKG="@qctl/vaultwarden-plugin@${PLUGIN_VERSION}"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "plugin_needed=false" >> "$GITHUB_OUTPUT"
            echo "- **plugin** \`${PKG}\`: already on npm (no approval)" >> "$GITHUB_STEP_SUMMARY"
          elif npm stage view "$PKG" >/dev/null 2>&1; then
            echo "plugin_needed=false" >> "$GITHUB_OUTPUT"
            echo "- **plugin** \`${PKG}\`: already staged — \`npm stage approve ${PKG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "plugin_needed=true" >> "$GITHUB_OUTPUT"
            echo "- **plugin** \`${PKG}\`: waiting for **release-plugin** approval" >> "$GITHUB_STEP_SUMMARY"
          fi

  approve-qctl:
    needs: plan
    if: needs.plan.outputs.qctl_needed == 'true'
    runs-on: ubuntu-latest
    environment: release-qctl
    steps:
      - run: echo "Approved qctl ${{ needs.plan.outputs.qctl_tag }}"

  publish-qctl:
    needs: [approve-qctl, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Refuse if already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.qctl_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists — skipping publish."
            exit 1
          fi

      - name: Compile linux-x64 binaries
        run: bun run compile

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/qctl-host dist/qctl-guest dist/qctl-platform-rocky.mjs release/
          chmod +x release/qctl-host release/qctl-guest
          (
            cd release
            sha256sum qctl-host qctl-guest qctl-platform-rocky.mjs | tee SHA256SUMS
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.qctl_tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          bun ci/release-notes.js > "$NOTES_FILE"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            release/qctl-host \
            release/qctl-guest \
            release/qctl-platform-rocky.mjs \
            release/SHA256SUMS

  approve-plugin:
    needs: plan
    if: needs.plan.outputs.plugin_needed == 'true'
    runs-on: ubuntu-latest
    environment: release-plugin
    steps:
      - run: echo "Approved plugin @${{ needs.plan.outputs.plugin_version }}"

  publish-plugin:
    needs: [approve-plugin, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check npm stage support
        run: |
          set -euo pipefail
          npm --version
          npm stage --help >/dev/null

      - name: Refuse if already published or staged
        working-directory: packages/vaultwarden-plugin
        env:
          VERSION: ${{ needs.plan.outputs.plugin_version }}
        run: |
          set -euo pipefail
          PKG="@qctl/vaultwarden-plugin@${VERSION}"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "::error::${PKG} already published on npm."
            exit 1
          fi
          if npm stage view "$PKG" >/dev/null 2>&1; then
            echo "::error::${PKG} already staged — approve with: npm stage approve ${PKG}"
            exit 1
          fi

      - name: Stage @qctl/vaultwarden-plugin on npm
        working-directory: packages/vaultwarden-plugin
        env:
          VERSION: ${{ needs.plan.outputs.plugin_version }}
        run: |
          set -euo pipefail
          # OIDC trusted publisher workflow filename: release.yml
          # Prefer stage-only permissions so direct `npm publish` from CI is rejected.
          npm stage publish --access public
          echo "Staged @qctl/vaultwarden-plugin@${VERSION}"
          echo "Approve (2FA): npm stage approve @qctl/vaultwarden-plugin@${VERSION}"
          echo "Or: https://www.npmjs.com → Staged Packages"
