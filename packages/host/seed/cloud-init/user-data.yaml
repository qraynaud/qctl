#cloud-config
# Slim bootstrap for `vm up` (appliance) and `vm init-tank`.
# Identity, disks, ports, packages, admin keys, VLAN parents, Tier-0, timezone,
# umask, ZFS modules, and sshd hardening live on cidata `qctl-seed/` or are
# applied by guest `qctl _internal_init` (host-baseline / start-services).
# Tags (resolved at seed build; cloud-init never sees them):
#   !template "…" — inline Nunjucks (provision.* = YAML; env / instance_id / profile / …)
#   !file path    — embed seed-kit/<path> (Nunjucks only if file has {{ or {%)
# Empty !template / !file result drops that write_files entry.
#
# `profile` is `appliance` (default) or `init-tank`.

hostname: rocky
manage_etc_hosts: true

bootcmd:
  - [systemctl, mask, NetworkManager-wait-online.service]
  # Appliance: mask until first-boot stamp. init-tank: always mask (no SSH).
  - !template |
      {% if is_init_tank %}
      systemctl mask sshd.service sshd.socket
      {% else %}
      if [ ! -f /var/lib/qctl/first-boot.done ]; then systemctl mask sshd.service sshd.socket firewalld.service cockpit.socket qemu-guest-agent.service; fi
      {% endif %}
  - !template |
      {% if provision.networking.vlans %}
      {% for name, v in provision.networking.vlans -%}
      ip link del {{ name }} 2>/dev/null || true
      ip link add {{ name }} type dummy
      ip link set {{ name }} up || true
      {% endfor -%}
      {% else %}
      true
      {% endif %}
  - [sh, -c, "nmcli networking on || true; nmcli device connect eth0 || true; dhclient -1 eth0 || true"]
  - [sh, -c, "for i in $(seq 1 90); do ping -c1 -W2 1.1.1.1 >/dev/null 2>&1 && exit 0; sleep 2; done; echo 'rocky bootcmd: no egress yet' >&2; exit 0"]

users:
  - name: !template "{{ provision.users.apps.username }}"
    uid: !template "{{ provision.users.apps.uid }}"
    gid: !template "{{ provision.users.apps.gid }}"
    system: true
    homedir: !template "/home/{{ provision.users.apps.username }}"
    no_create_home: false
    shell: /bin/bash
    lock_passwd: true
    groups: [systemd-journal]
  - name: root
    lock_passwd: true

disable_root: true
ssh_pwauth: false
ssh_deletekeys: false

package_update: false
package_upgrade: false
packages: []

write_files:
  - path: /etc/cloud/cloud.cfg.d/99-rocky-network-renderer.cfg
    owner: root:root
    permissions: "0644"
    content: |
      system_info:
        network:
          renderers: ['network-manager', 'sysconfig', 'netplan', 'networkd', 'eni']

  - path: /usr/local/lib/rocky/install-qctl-guest.sh
    owner: root:root
    permissions: "0755"
    content: !file lib/install-qctl-guest.sh

  - path: /usr/local/lib/rocky/wait-qctl-init.sh
    owner: root:root
    permissions: "0755"
    content: !file lib/wait-qctl-init.sh

  - path: /var/lib/cloud/scripts/per-boot/90-rocky-wait-qctl-init.sh
    owner: root:root
    permissions: "0755"
    content: !file lib/wait-qctl-init.sh

  - path: /etc/systemd/system/rocky-first-boot.service
    owner: root:root
    permissions: "0644"
    content: !file first-boot/rocky-first-boot.service

  - path: /etc/systemd/system/rocky-init-tank-prep.service
    owner: root:root
    permissions: "0644"
    content: !file first-boot/rocky-init-tank-prep.service

runcmd:
  - !template |
      set -euo pipefail
      /usr/local/lib/rocky/install-qctl-guest.sh
      systemctl daemon-reload
      {% if is_init_tank %}
      # Packages + Tier-0 seal run inside qctl _internal_init (ISO qctl-seed/).
      systemctl enable rocky-init-tank-prep.service
      systemctl start rocky-init-tank-prep.service
      {% else %}
      loginctl enable-linger {{ provision.users.apps.username }}
      # OS upgrade before first-boot oneshot: upgrading systemd/cloud-init under a
      # blocking `systemctl start` of rocky-first-boot resets D-Bus and fails
      # cloud-init while qctl is still running. Guest init then only installs.
      dnf -y upgrade --refresh
      systemctl enable rocky-first-boot.service
      /usr/local/lib/rocky/wait-qctl-init.sh
      {% endif %}

final_message: !template |
  {% if is_init_tank %}
  Rocky init-tank: prep will create tank, export, and power off. No SSH.
  {% else %}
  Rocky cloud-init OK — qctl _internal_init stamped (/var/lib/qctl/first-boot.done).
  Tank unlock: keylocation=file:///etc/credstore/rocky/tank_passphrase_<poolId>
  Expect disks: OS + /vw + 5 data (raidz2) + 2 special (mirror).
  {% endif %}
