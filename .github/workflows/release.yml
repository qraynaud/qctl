name: release

# After merge to main: re-run checks, then optionally publish the GitHub release
# (Review deployments on environment `release-qctl` only when v$version is new).
# `varlock-local-encrypt` is embedded in qctl-host/qctl-guest (not a separate asset).
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/pr-check.yml

  plan:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Plan qctl release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(bun ci/check-version.js)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "### qctl release"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "\`${TAG}\` already published — no approval." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            {
              echo "\`${TAG}\` not published — waiting for **release-qctl** approval."
              echo ""
              echo "<details><summary>Changelog preview</summary>"
              echo ""
              bun ci/release-changelog.js
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  approve:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    environment: release-qctl
    steps:
      - run: echo "Approved qctl ${{ needs.plan.outputs.tag }}"

  publish:
    needs: [approve, plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Refuse if already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists — skipping publish."
            exit 1
          fi

      - name: Compile linux-x64 binaries
        run: bun run compile

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/qctl-host dist/qctl-guest dist/qctl-platform-rocky.mjs release/
          chmod +x release/qctl-host release/qctl-guest
          (
            cd release
            sha256sum qctl-host qctl-guest qctl-platform-rocky.mjs | tee SHA256SUMS
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          bun ci/release-notes.js > "$NOTES_FILE"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            release/qctl-host \
            release/qctl-guest \
            release/qctl-platform-rocky.mjs \
            release/SHA256SUMS
