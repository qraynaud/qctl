[tools]
bun = "1.4.2"
npm = "latest"

# Host packages for `qctl vm seed` (ISO preferred; FAT needs mtools + dosfstools).
# Apply with: mise bootstrap packages apply --yes
[bootstrap.packages]
"apt:genisoimage" = "latest"
"apt:mtools" = "latest"
"apt:dosfstools" = "latest"
"pacman:xorriso" = "latest"
"pacman:mtools" = "latest"
"pacman:dosfstools" = "latest"
